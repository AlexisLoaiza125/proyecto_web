<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Fitness App{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1f2435;--border:#2a3045;
  --accent:#22d3a5;--accent2:#6366f1;--accent3:#f59e0b;--danger:#ef4444;
  --text:#e2e8f0;--muted:#64748b;--success:#10b981;
  --font:'Space Grotesk',sans-serif;--mono:'Space Mono',monospace;
  --radius:10px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}

/* ── NAVBAR ── */
.navbar{
  position:sticky;top:0;z-index:200;
  background:rgba(15,17,23,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 28px;height:60px;
}
.nav-brand{
  font-family:var(--mono);font-size:15px;font-weight:700;
  color:var(--accent);text-decoration:none;white-space:nowrap;margin-right:8px;
}
.nav-links{display:flex;gap:4px;flex:1}
.nav-link{
  padding:6px 14px;border-radius:6px;text-decoration:none;
  color:var(--muted);font-size:13.5px;font-weight:500;transition:.15s;
  display:flex;align-items:center;gap:7px;
}
.nav-link:hover,.nav-link.active{color:var(--text);background:var(--surface2)}
.nav-link.active{color:var(--accent)}
/* search */
.nav-search{position:relative;margin-left:auto}
.nav-search input{
  background:var(--surface2);border:1px solid var(--border);border-radius:20px;
  padding:7px 16px 7px 38px;color:var(--text);font-family:var(--font);font-size:13px;
  width:220px;outline:none;transition:.2s;
}
.nav-search input:focus{border-color:var(--accent);width:280px}
.nav-search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.nav-search .results{
  display:none;position:absolute;top:calc(100% + 6px);right:0;width:320px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);z-index:300;overflow:hidden;
}
.nav-search .results.show{display:block}
.search-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  text-decoration:none;color:var(--text);font-size:13px;transition:.1s;
  border-bottom:1px solid var(--border);
}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:var(--surface2)}
.search-item .badge{font-size:10px;padding:2px 7px;border-radius:20px;font-family:var(--mono);flex-shrink:0}

/* ── LAYOUT ── */
.container{max-width:1280px;margin:0 auto;padding:28px 24px}
.page-header{margin-bottom:28px}
.page-header h1{font-size:26px;font-weight:700}
.page-header p{color:var(--muted);margin-top:4px;font-size:14px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text)}
.card-body{padding:20px}

/* ── GRID ── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* ── STAT CARDS ── */
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.c1::before{background:var(--accent)}
.stat-card.c2::before{background:var(--accent2)}
.stat-card.c3::before{background:var(--accent3)}
.stat-card.c4::before{background:var(--danger)}
.stat-icon{font-size:28px;margin-bottom:10px;opacity:.7}
.stat-val{font-size:36px;font-weight:700;font-family:var(--mono);line-height:1}
.stat-card.c1 .stat-val{color:var(--accent)}
.stat-card.c2 .stat-val{color:var(--accent2)}
.stat-card.c3 .stat-val{color:var(--accent3)}
.stat-card.c4 .stat-val{color:var(--danger)}
.stat-label{font-size:12px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.8px}

/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-family:var(--mono)}
input,select,textarea{
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  padding:9px 12px;color:var(--text);font-family:var(--font);font-size:13.5px;
  outline:none;transition:.15s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#1a2035}
input.error,select.error{border-color:var(--danger)}
.field-error{font-size:11px;color:var(--danger);margin-top:3px;display:none}
textarea{resize:vertical;min-height:80px}
select option{background:var(--surface2)}
/* preview multimedia */
.img-preview{
  width:100%;max-height:180px;object-fit:cover;border-radius:7px;
  border:1px solid var(--border);margin-top:8px;display:none;
}
.img-preview.show{display:block}

/* ── BUTTONS ── */
.btn{padding:9px 20px;border-radius:7px;border:none;cursor:pointer;font-size:13.5px;font-weight:600;font-family:var(--font);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--accent);color:#0f1117}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-icon{padding:6px 8px;border-radius:6px}

/* ── TABLES ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid rgba(42,48,69,.6);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-family:var(--mono);font-weight:700}
.badge-get{background:rgba(99,102,241,.2);color:#818cf8}
.badge-post{background:rgba(34,211,165,.2);color:var(--accent)}
.badge-put{background:rgba(245,158,11,.2);color:#fbbf24}
.badge-delete{background:rgba(239,68,68,.2);color:#f87171}
.badge-active{background:rgba(16,185,129,.15);color:var(--success)}
.badge-inactive{background:rgba(100,116,139,.15);color:var(--muted)}

/* ── AVATAR ── */
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* ── EXERCISE CARD ── */
.ex-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:.2s;
}
.ex-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.ex-card img{width:100%;height:160px;object-fit:cover;background:var(--surface2)}
.ex-card-body{padding:14px}
.ex-card-title{font-weight:600;font-size:14px;margin-bottom:6px}
.ex-card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ex-card-desc{font-size:12px;color:var(--muted);line-height:1.5}
.ex-card-actions{display:flex;gap:6px;margin-top:12px}

/* ── TIPO COLORS ── */
.tipo-fuerza{background:rgba(99,102,241,.2);color:#818cf8}
.tipo-cardio{background:rgba(236,72,153,.2);color:#f472b6}
.tipo-funcional{background:rgba(245,158,11,.2);color:#fbbf24}
.tipo-hiit{background:rgba(239,68,68,.2);color:#f87171}
.tipo-flexibilidad{background:rgba(167,139,250,.2);color:#c4b5fd}

/* ── ALERTS ── */
.alert{padding:12px 16px;border-radius:7px;font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.alert-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.alert-info{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);color:#a5b4fc}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.3}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── TOAST ── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 18px;border-radius:8px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:10px;min-width:260px;
  animation:slideIn .25s ease;box-shadow:var(--shadow);
}
.toast-success{background:#065f46;border:1px solid var(--success);color:#6ee7b7}
.toast-error{background:#7f1d1d;border:1px solid var(--danger);color:#fca5a5}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="nav-brand" href="/"><i class="fas fa-dumbbell"></i> FitnessAPI</a>
  <div class="nav-links">
    <a class="nav-link {% if active=='dashboard' %}active{% endif %}" href="/"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a class="nav-link {% if active=='usuarios' %}active{% endif %}" href="/usuarios"><i class="fas fa-users"></i> Usuarios</a>
    <a class="nav-link {% if active=='ejercicios' %}active{% endif %}" href="/ejercicios"><i class="fas fa-fire"></i> Ejercicios</a>
    <a class="nav-link {% if active=='rutinas' %}active{% endif %}" href="/rutinas"><i class="fas fa-calendar-check"></i> Rutinas</a>
    <a class="nav-link {% if active=='progreso' %}active{% endif %}" href="/progreso"><i class="fas fa-chart-bar"></i> Progreso</a>
  </div>
  <div class="nav-search">
    <i class="fas fa-search ico"></i>
    <input type="text" id="globalSearch" placeholder="Buscar ejercicios, usuarios..." autocomplete="off">
    <div class="results" id="searchResults"></div>
  </div>
</nav>
{% block content %}{% endblock %}

<div id="toast-container"></div>

<script>
// ── TOAST ──
function toast(msg, type='success'){
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 3000);
}

// ── GLOBAL SEARCH ──
let searchTimer;
document.getElementById('globalSearch').addEventListener('input', function(){
  clearTimeout(searchTimer);
  const q = this.value.trim();
  const box = document.getElementById('searchResults');
  if(q.length < 2){ box.classList.remove('show'); return; }
  searchTimer = setTimeout(async ()=>{
    const [u, e] = await Promise.all([
      fetch(`/api/usuarios/?q=${encodeURIComponent(q)}&limit=4`).then(r=>r.json()).catch(()=>[]),
      fetch(`/api/ejercicios/?q=${encodeURIComponent(q)}&limit=4`).then(r=>r.json()).catch(()=>[])
    ]);
    let html = '';
    u.forEach(x=> html += `<a class="search-item" href="/usuarios/${x.id}"><img src="${x.foto_perfil||'/static/default-avatar.svg'}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--surface2)"> <div><div>${x.nombre}</div><div style="font-size:11px;color:var(--muted)">@${x.username}</div></div><span class="badge badge-get">usuario</span></a>`);
    e.forEach(x=> html += `<a class="search-item" href="/ejercicios/${x.id}"><i class="fas fa-dumbbell" style="color:var(--accent);width:28px;text-align:center"></i> <div><div>${x.nombre}</div><div style="font-size:11px;color:var(--muted)">${x.tipo}</div></div><span class="badge tipo-${x.tipo}">${x.tipo}</span></a>`);
    if(!html) html = '<div style="padding:14px;color:var(--muted);font-size:13px;text-align:center">Sin resultados</div>';
    box.innerHTML = html; box.classList.add('show');
  }, 280);
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.nav-search')) document.getElementById('searchResults').classList.remove('show');
});

// ── IMAGE URL PREVIEW ──
function previewImg(inputId, previewId){
  const url = document.getElementById(inputId).value.trim();
  const img = document.getElementById(previewId);
  if(url){ img.src=url; img.classList.add('show'); img.onerror=()=>img.classList.remove('show'); }
  else img.classList.remove('show');
}

// ── FORM VALIDATION ──
function validateRequired(formId){
    let ok = true;

    document.querySelectorAll(`#${formId} input, #${formId} select, #${formId} textarea`)
    .forEach(el => {

        const err = el.parentElement.querySelector('.field-error');

        if (!el.checkValidity()) {
            el.classList.add('error');

            if (err) {
                err.textContent = el.validationMessage;
                err.style.display = 'block';
            }

            ok = false;
        } else {
            el.classList.remove('error');

            if (err) {
                err.style.display = 'none';
            }
        }
    });

    return ok;
}

// ── MODAL HELPERS ──
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('show'); });
});

// ── CONFIRM DELETE ──
function confirmDelete(url, name){
  if(confirm(`¿Desactivar "${name}"? La información se conservará en el historial.`)){
    fetch(url, {method:'DELETE'}).then(r=>r.json()).then(d=>{
      toast(d.mensaje||'Desactivado correctamente'); setTimeout(()=>location.reload(), 800);
    }).catch(()=>toast('Error al desactivar', 'error'));
  }
}
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
